<p-toast position="top-center" />
<p-confirmdialog />
@if (loader.actif()) { <p-progressbar mode="indeterminate" [showValue]="false" class="barre-chargement no-print" /> }

<p-menubar [model]="menu()" class="entete-site no-print">
  <ng-template #start>
    <a routerLink="/" class="marque"><img src="logo.svg" alt="" width="36" height="36"> <span>Billets d'avion</span></a>
  </ng-template>
  <ng-template #end>
    @if (auth.utilisateur(); as u) {
      <p-button [label]="u.prenom || u.nom" icon="pi pi-user" severity="secondary" [raised]="true" (onClick)="m.toggle($event)" />
      <p-menu #m [model]="menuCompte" [popup]="true" />
    } @else {
      <p-button label="Se connecter" icon="pi pi-sign-in" severity="secondary" [raised]="true" (onClick)="seConnecter()" />
    }
  </ng-template>
</p-menubar>

<main><router-outlet /></main>
<app-chat class="no-print" />
