@if (loader.actif()) { <div class="barre-chargement no-print" role="progressbar" aria-label="Chargement"></div> }
<header class="entete-site no-print">
  <a routerLink="/" class="marque"><img src="logo.svg" alt="" width="40" height="40"> <span>Billets d'avion</span></a>
  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Vols</a>
    <a routerLink="/promotions" routerLinkActive="active">Promotions</a>
    @if (auth.estConnecte() && !auth.estAdmin()) { <a routerLink="/mes-voyages" routerLinkActive="active">Mes voyages</a> }
    @if (auth.estAdmin()) { <a routerLink="/admin" routerLinkActive="active">Administration</a> }
  </nav>
  <div class="compte-menu">
    @if (auth.utilisateur(); as u) {
      <a routerLink="/compte" class="utilisateur">👤 {{ u.prenom || u.nom }}</a>
      <button class="small sec" (click)="deconnecter()">Se déconnecter</button>
    } @else {
      <a routerLink="/connexion" class="bouton">Se connecter</a>
    }
  </div>
</header>
@if (notifier.message(); as m) {
  <div class="alert alert-{{ m.type }} no-print">{{ m.text }}</div>
}
<main><router-outlet /></main>
<app-chat class="no-print" />
