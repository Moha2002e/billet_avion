spring.application.name=billet-avion
server.port=8080
# Base H2 stockée dans backend/data (remplaçable par MySQL, voir README)
spring.datasource.url=jdbc:h2:file:./data/billet;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jackson.serialization.write-dates-as-timestamps=false
app.cors.origins=http://localhost:4200
# Compte administrateur (À CHANGER en production : variables ADMIN_USERNAME / ADMIN_PASSWORD)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
