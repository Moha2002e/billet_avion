spring.application.name=billet-avion
server.port=8080
# Base H2 stockée dans backend/data (remplaçable par MySQL, voir README)
spring.datasource.url=jdbc:h2:file:./data/billet;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jackson.serialization.write-dates-as-timestamps=false
app.cors.origins=http://localhost:4200
